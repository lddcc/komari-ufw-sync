# Publish a GitHub Release with the built plugin zip whenever a vX.Y.Z tag is
# pushed. Release notes come from the tag's own annotated message (--notes-from-tag),
# so `git tag -a vX.Y.Z -m "..."` is the single source of truth — no separate
# release-notes step to keep in sync.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the annotated tag object for --notes-from-tag

      - name: Build plugin zip
        run: ./build.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --notes-from-tag \
            --verify-tag \
            dist/*.zip
