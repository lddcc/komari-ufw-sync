<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UFW Sync</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { opacity: .7; margin: 0 0 14px; font-size: 12.5px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .spacer { flex: 1; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); background: transparent; cursor: pointer; }
  button:hover { border-color: rgba(128,128,128,.8); }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  button.danger { background: #dc2626; color: #fff; border-color: #dc2626; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.mini { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid rgba(128,128,128,.18); white-space: nowrap; }
  th { font-weight: 600; font-size: 12px; opacity: .75; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; }
  .ok { background: rgba(22,163,74,.15); color: #16a34a; }
  .warn { background: rgba(217,119,6,.15); color: #d97706; }
  .muted { background: rgba(128,128,128,.15); opacity: .8; }
  .row-off td:not(.selcol) { opacity: .45; }
  .portin { width: 130px; padding: 4px 6px; border-radius: 6px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; font: inherit; font-size: 12.5px; }
  #log { margin-top: 14px; border: 1px solid rgba(128,128,128,.25); border-radius: 10px; padding: 10px 12px; max-height: 340px; overflow: auto; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .toast { font-size: 12.5px; opacity: .8; }
  .count { font-size: 12.5px; opacity: .8; }
  details#settings { margin-bottom: 14px; border: 1px solid rgba(128,128,128,.25); border-radius: 10px; padding: 8px 12px; }
  details#settings summary { cursor: pointer; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin: 12px 0; }
  .field > .flab { font-size: 12.5px; font-weight: 600; margin-bottom: 6px; opacity: .85; }
  .listwrap { display: flex; flex-direction: column; gap: 6px; }
  .lrow { display: flex; gap: 6px; }
  .lrow input { flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; font: inherit; }
  .switches { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 6px 0 10px; font-size: 12.5px; }
  .switches label { display: flex; align-items: center; gap: 6px; }
  .switches input[type=number] { width: 72px; padding: 5px 7px; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; font: inherit; }
</style>
</head>
<body>
  <h1>UFW Sync — 节点选择与执行</h1>
  <p class="sub">勾选参与同步的节点。<b>Dry-run</b> 仅计算差异不改动；<b>应用</b> 才写入 ufw（fail-safe：可信白名单为空/无 ufw 会自动跳过，绝不锁死）。可信白名单对来源全放行；公共端口按节点单独开放给全网（host + docker）。<b>可信白名单 / 频率</b>在「UFW 配置」页设置。</p>

  <div class="bar">
    <button id="btnAll">全选</button>
    <button id="btnInvert">反选</button>
    <button id="btnReset">重置(全选)</button>
    <span class="count" id="selCount"></span>
    <span class="spacer"></span>
    <button id="btnStatus">刷新状态</button>
    <button id="btnDry" class="primary">Dry-run 选中</button>
    <button id="btnApply" class="danger">应用 选中</button>
  </div>

  <table>
    <thead>
      <tr>
        <th class="selcol"><input type="checkbox" id="chkHead" title="全选/取消" /></th>
        <th>节点</th>
        <th>区域</th>
        <th>ufw 状态</th>
        <th>ufw-docker</th>
        <th>tailscale</th>
        <th class="num">已放行</th>
        <th class="num">公共</th>
        <th>公共端口 TCP</th>
        <th>公共端口 UDP</th>
        <th>上次结果</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="11">加载中…</td></tr></tbody>
  </table>
  <p class="sub" style="margin-top:8px">公共端口示例：<code>80,443,8000:8100</code>（逗号分隔，支持端口段）。改动后自动保存，下次同步生效。</p>

  <div id="log" hidden></div>
  <p class="toast" id="toast"></p>

<script>
const $ = (s) => document.querySelector(s);
const api = (p, opt) => fetch(p, Object.assign({ credentials: "same-origin", headers: { "Content-Type": "application/json" } }, opt)).then(r => r.json());
let nodes = [];        // [{uuid,name,region,...}]
let selected = new Set();
let pub = {};          // { uuid: {tcp:[],udp:[]} }

function toast(m) { $("#toast").textContent = m || ""; }
function logln(m) { const el = $("#log"); el.hidden = false; el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; }
function clearLog() { $("#log").textContent = ""; $("#log").hidden = true; }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

/* ---------- node table ---------------------------------------------------- */
function ufwPill(s) {
  if (!s) return '<span class="pill muted">—</span>';
  if (s === "active") return '<span class="pill ok">active</span>';
  if (s === "missing") return '<span class="pill muted">missing</span>';
  return '<span class="pill warn">' + s + '</span>';
}
function dockerPill(s) {
  if (s == null) return '<span class="pill muted">—</span>';
  if (s === "yes") return '<span class="pill ok">集成</span>';
  if (s === "no") return '<span class="pill warn">未集成</span>';
  return '<span class="pill muted">' + escapeHtml(s) + '</span>';
}
function tsPill(s, port) {
  if (s == null || s === "") return '<span class="pill muted">—</span>';
  const p = port && port !== "none" ? ' <span style="opacity:.7">:' + escapeHtml(port) + '</span>' : "";
  if (s === "up") return '<span class="pill ok">up</span>' + p;
  if (s === "down") return '<span class="pill warn">down</span>';
  if (s === "none") return '<span class="pill muted">未安装</span>';
  return '<span class="pill muted">' + escapeHtml(s) + '</span>';
}
function pubStr(uuid, proto) {
  const p = pub[uuid]; return p && p[proto] ? p[proto].join(",") : "";
}
// merge a status object {ufw,ufwdocker,trusted,pub,tailscale,tsport} into a node + refresh cells
function applyStatus(uuid, x) {
  const n = nodes.find(n => n.uuid === uuid); if (!n || !x) return;
  if (x.ufw !== undefined) n.ufw = x.ufw;
  if (x.ufwdocker !== undefined) n.ufwdocker = x.ufwdocker;
  if (x.trusted !== undefined) n.trusted = x.trusted;
  if (x.pub !== undefined) n.pubCount = x.pub;
  if (x.tailscale !== undefined) n.tailscale = x.tailscale;
  if (x.tsport !== undefined) n.tsport = x.tsport;
  const c1 = document.querySelector('[data-ufw="' + uuid + '"]'); if (c1) c1.innerHTML = ufwPill(n.ufw);
  const c2 = document.querySelector('[data-ufwd="' + uuid + '"]'); if (c2) c2.innerHTML = dockerPill(n.ufwdocker);
  const cts = document.querySelector('[data-ts="' + uuid + '"]'); if (cts) cts.innerHTML = tsPill(n.tailscale, n.tsport);
  const c3 = document.querySelector('[data-trusted="' + uuid + '"]'); if (c3) c3.textContent = n.trusted == null ? "" : n.trusted;
  const c4 = document.querySelector('[data-pubcnt="' + uuid + '"]'); if (c4) c4.textContent = n.pubCount == null ? "" : n.pubCount;
}

function render() {
  const tb = $("#rows");
  tb.innerHTML = "";
  nodes.forEach(n => {
    const tr = document.createElement("tr");
    tr.className = selected.has(n.uuid) ? "" : "row-off";
    tr.innerHTML =
      '<td class="selcol"><input type="checkbox" data-u="' + n.uuid + '"' + (selected.has(n.uuid) ? " checked" : "") + '></td>' +
      '<td>' + escapeHtml(n.name) + '</td>' +
      '<td>' + escapeHtml(n.region || "") + '</td>' +
      '<td data-ufw="' + n.uuid + '">' + ufwPill(n.ufw) + '</td>' +
      '<td data-ufwd="' + n.uuid + '">' + dockerPill(n.ufwdocker) + '</td>' +
      '<td data-ts="' + n.uuid + '">' + tsPill(n.tailscale, n.tsport) + '</td>' +
      '<td class="num" data-trusted="' + n.uuid + '">' + (n.trusted == null ? "" : n.trusted) + '</td>' +
      '<td class="num" data-pubcnt="' + n.uuid + '">' + (n.pubCount == null ? "" : n.pubCount) + '</td>' +
      '<td><input class="portin" data-pub-tcp="' + n.uuid + '" value="' + escapeHtml(pubStr(n.uuid,"tcp")) + '" placeholder=""></td>' +
      '<td><input class="portin" data-pub-udp="' + n.uuid + '" value="' + escapeHtml(pubStr(n.uuid,"udp")) + '" placeholder=""></td>' +
      '<td data-res="' + n.uuid + '">' + escapeHtml(n.lastResult || "") + '</td>';
    tb.appendChild(tr);
  });
  tb.querySelectorAll('input[data-u]').forEach(cb => cb.addEventListener("change", onToggle));
  tb.querySelectorAll('input[data-pub-tcp],input[data-pub-udp]').forEach(inp => inp.addEventListener("change", onPubChange));
  updateCount();
}

function parsePorts(s){ return String(s||"").split(/[\s,]+/).map(x=>x.trim()).filter(Boolean); }
function onPubChange(e) {
  const el = e.target;
  const uuid = el.getAttribute("data-pub-tcp") || el.getAttribute("data-pub-udp");
  const tcp = parsePorts(document.querySelector('[data-pub-tcp="' + uuid + '"]').value);
  const udp = parsePorts(document.querySelector('[data-pub-udp="' + uuid + '"]').value);
  api("/ufw/api/pub", { method: "POST", body: JSON.stringify({ uuid, tcp, udp }) })
    .then(r => { if (r && r.pub) pub = r.pub; toast("已保存公共端口"); })
    .catch(() => toast("保存端口失败"));
}

function updateCount() {
  $("#selCount").textContent = "已选 " + selected.size + " / " + nodes.length;
  $("#chkHead").checked = nodes.length > 0 && selected.size === nodes.length;
}
function onToggle(e) {
  const u = e.target.getAttribute("data-u");
  if (e.target.checked) selected.add(u); else selected.delete(u);
  e.target.closest("tr").className = e.target.checked ? "" : "row-off";
  updateCount(); saveSelection();
}
function saveSelection() {
  api("/ufw/api/selection", { method: "POST", body: JSON.stringify({ uuids: Array.from(selected) }) })
    .then(() => toast("已保存选择")).catch(() => toast("保存失败"));
}

$("#btnAll").onclick = () => { selected = new Set(nodes.map(n => n.uuid)); render(); saveSelection(); };
$("#btnInvert").onclick = () => { const s = new Set(); nodes.forEach(n => { if (!selected.has(n.uuid)) s.add(n.uuid); }); selected = s; render(); saveSelection(); };
$("#btnReset").onclick = () => { selected = new Set(nodes.map(n => n.uuid)); render(); saveSelection(); toast("已重置为全选"); };
$("#chkHead").onchange = (e) => { selected = e.target.checked ? new Set(nodes.map(n => n.uuid)) : new Set(); render(); saveSelection(); };

$("#btnStatus").onclick = async () => {
  toast("正在探测各节点状态…"); setBusy(true);
  try {
    const r = await api("/ufw/api/status", { method: "POST", body: "{}" });
    (r.results || []).forEach(x => applyStatus(x.uuid, x));
    toast("状态已更新");
  } catch (e) { toast("探测失败: " + e); } finally { setBusy(false); }
};

async function run(mode) {
  if (selected.size === 0) { toast("未选择任何节点"); return; }
  if (mode === "apply" && !confirm("将对选中的 " + selected.size + " 台节点真正写入 ufw 规则，确认？")) return;
  clearLog(); setBusy(true); toast(mode === "apply" ? "正在应用…" : "正在 dry-run…");
  logln("== " + (mode === "apply" ? "APPLY" : "DRY-RUN") + " on " + selected.size + " nodes ==");
  try {
    const r = await api("/ufw/api/run", { method: "POST", body: JSON.stringify({ mode, uuids: Array.from(selected) }) });
    (r.results || []).forEach(x => {
      logln("--- " + x.node + "  exit=" + x.exit_code + " ---");
      logln(x.output || "");
      const n = nodes.find(n => n.uuid === x.uuid) || nodes.find(n => n.name === x.node); if (!n) return;
      const first = (x.output || "").split("\n").find(l => /MODE=|SKIP|no change|ERROR|applied|pub/.test(l)) || ("exit=" + x.exit_code);
      n.lastResult = first.replace(/^\[ufw-sync\]\s*/, "");
      const c = document.querySelector('[data-res="' + n.uuid + '"]'); if (c) c.textContent = n.lastResult;
    });
    // sync also refreshes status (parsed from each node's STATUS line)
    (r.status || []).forEach(x => applyStatus(x.uuid, x));
    if (r.missing && r.missing.length) logln("(no response: " + r.missing.join(", ") + ")");
    toast("完成");
  } catch (e) { toast("执行失败: " + e); logln("ERROR " + e); } finally { setBusy(false); }
}
$("#btnDry").onclick = () => run("check");
$("#btnApply").onclick = () => run("apply");

function setBusy(b) { ["btnStatus","btnDry","btnApply","btnAll","btnInvert","btnReset"].forEach(id => $("#"+id).disabled = b); }

async function init() {
  try {
    const r = await api("/ufw/api/state");
    nodes = r.nodes || [];
    pub = r.pub || {};
    const status = r.status || {};   // persisted last-known status per uuid
    nodes.forEach(n => {
      const s = status[n.uuid]; if (!s) return;
      n.ufw = s.ufw; n.ufwdocker = s.ufwdocker; n.trusted = s.trusted; n.pubCount = s.pub;
      n.tailscale = s.tailscale; n.tsport = s.tsport;
    });
    selected = new Set(r.selection == null ? nodes.map(n => n.uuid) : r.selection);
    render();
  } catch (e) { $("#rows").innerHTML = '<tr><td colspan="11">加载失败：' + escapeHtml(String(e)) + '</td></tr>'; }
}
init();
</script>
</body>
</html>
